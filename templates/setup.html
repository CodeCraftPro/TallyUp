{% extends "base.html" %}
{% block title %}TallyUp — Setup Group{% endblock %}
{% block nav %}{% endblock %}

{% block content %}
<div style="height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;">
  <div class="card" style="width: 100%; max-width: 480px; padding: 20px;">
    <!-- ASCII Header -->
    <div style="border-bottom: 1px solid #2a2a2a; padding-bottom: 10px; margin-bottom: 16px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="color: #0A8F20; font-weight: 700; letter-spacing: 0.1em; font-size: 13px;">TALLYUP // BOOT</span>
        <span class="badge badge-dim">SESSION INIT</span>
      </div>
      <p style="font-size: 11px; color: #666; margin: 4px 0 0 0;">Create your group roster to begin splitting expenses.</p>
    </div>

    <form method="post" id="setupForm" style="display: flex; flex-direction: column; gap: 16px;">
      <!-- People Count Stepper -->
      <div>
        <label for="peopleCount" style="display: block; font-size: 11px; color: #666; margin-bottom: 6px;">HOW MANY PEOPLE ARE SPLITTING?</label>
        <div style="display: flex; align-items: center; gap: 6px;">
          <button type="button" id="decrementBtn" class="btn btn-dim" style="width: 36px; height: 36px; padding: 0; justify-content: center; font-size: 14px;" aria-label="Decrease count">−</button>
          <input id="peopleCount" type="number" min="1" max="20" value="3" style="text-align: center; height: 36px; font-weight: 600; font-size: 14px; width: 80px;">
          <button type="button" id="incrementBtn" class="btn btn-dim" style="width: 36px; height: 36px; padding: 0; justify-content: center; font-size: 14px;" aria-label="Increase count">+</button>
        </div>
      </div>

      <!-- Member Names List -->
      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label style="font-size: 11px; color: #666;">MEMBER NAMES</label>
          <span style="font-size: 10px; color: #555;">[X] REMOVE</span>
        </div>
        <div id="nameFields" class="panel-scroll" style="display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; padding-right: 4px;"></div>
      </div>

      <div style="border-top: 1px solid #2a2a2a; padding-top: 14px;">
        <button type="submit" class="btn btn-solid" style="width: 100%; height: 38px; justify-content: center; font-size: 12px; font-weight: 600;">
          [► START SPLITTING]
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const nameFields = document.getElementById('nameFields');
  const peopleCount = document.getElementById('peopleCount');
  const seedNames = ['Alice', 'Bob', 'Charlie', 'Dana', 'Ethan', 'Farah'];
  const avatars = ['🧑','👩','👨','🧑‍💻','👩‍🎨','🧔','🧒','👩‍🔬'];

  function currentNames() {
    return Array.from(nameFields.querySelectorAll('input[name="names"]')).map(i => i.value);
  }

  function renderFields(count) {
    const safeCount = Math.max(1, Math.min(20, Number(count) || 1));
    peopleCount.value = safeCount;
    const existing = currentNames();
    nameFields.innerHTML = '';

    for (let i = 0; i < safeCount; i++) {
      const wrapper = document.createElement('div');
      wrapper.className = 'group';
      wrapper.style.display = 'flex';
      wrapper.style.alignItems = 'center';
      wrapper.style.gap = '6px';
      wrapper.innerHTML = `
        <span style="font-size: 14px; width: 24px; text-align: center;">${avatars[i % avatars.length]}</span>
        <input type="text" name="names" required maxlength="40" placeholder="Person ${i+1}"
          value="${(existing[i] || seedNames[i] || '').replace(/"/g, '&quot;')}"
          style="flex: 1; height: 32px; font-size: 12px;">
        <button type="button" class="delete-person btn btn-dim btn-sm" style="height: 32px; width: 32px; padding: 0; justify-content: center;" aria-label="Remove person">✕</button>
      `;
      nameFields.appendChild(wrapper);
    }
    bindDeleteButtons();
  }

  function bindDeleteButtons() {
    nameFields.querySelectorAll('.delete-person').forEach(btn => {
      btn.addEventListener('click', () => {
        if (Number(peopleCount.value) <= 1) return;
        btn.closest('.group').remove();
        const rows = nameFields.querySelectorAll('.group').length;
        peopleCount.value = rows;
        const names = currentNames();
        renderFields(rows);
        nameFields.querySelectorAll('input[name="names"]').forEach((input, idx) => input.value = names[idx] || '');
      });
    });
  }

  peopleCount.addEventListener('input', e => renderFields(e.target.value));
  document.getElementById('incrementBtn').addEventListener('click', () => renderFields(Number(peopleCount.value || 0) + 1));
  document.getElementById('decrementBtn').addEventListener('click', () => renderFields(Number(peopleCount.value || 0) - 1));
  renderFields(peopleCount.value);
</script>
{% endblock %}
